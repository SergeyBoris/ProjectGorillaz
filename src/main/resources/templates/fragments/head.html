    <section>
        <nav class="navbar navbar-expand-md bg-body" style="width: 100%;">
            <div class="container-fluid">

                <!-- Flex контейнер для dropdown и списка -->
                <div class="d-flex align-items-center gap-3 w-100">

                    <!-- Dropdown с датой -->
                    <div class="dropdown">
                        <button class="btn btn-primary dropdown-toggle" type="button" id="mainDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            Выбор Даты
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="mainDropdown" id="dateDropdown">
                            <!-- Динамически заполняется JS -->
                        </ul>
                    </div>

                    <!-- Контрагенты -->
                    <div class="collapse navbar-collapse show" id="navcol-1"> <!-- show: сразу видно -->
                        <ul class="navbar-nav" id="contragentList" style="flex-direction: row; gap: 10px;">
                            <!-- Динамически заполняется JS контрагенты -->
                        </ul>
                    </div>

                </div>
            </div>

    <script>
        async function loadDateDropdown() {
            try {
                const response = await fetch('/request/available-dates');
                if (!response.ok) throw new Error('Ошибка загрузки данных');

                const dateMap = await response.json(); // объект вида { "2025": [1,2], ... }
                const dropdown = document.getElementById("dateDropdown");

                dropdown.innerHTML = ''; // Очистим, если вдруг есть старые данные

                for (const [year, months] of Object.entries(dateMap)) {
                    const yearLi = document.createElement("li");
                    yearLi.classList.add("dropdown");

                    const yearLink = document.createElement("a");
                    yearLink.className = "dropdown-item dropdown-toggle";
                    yearLink.href = "#";
                    yearLink.textContent = year;
                    yearLink.setAttribute("data-bs-toggle", "dropdown");

                    const monthsDropdown = document.createElement("ul");
                    monthsDropdown.className = "dropdown-menu";

                    months.forEach(month => {
                        const monthLi = document.createElement("li");
                        const monthLink = document.createElement("a");
                        monthLink.className = "dropdown-item";
                        monthLink.href = "#";
                        monthLink.textContent = String(month).padStart(2, '0');
                        monthLi.appendChild(monthLink);
                        monthsDropdown.appendChild(monthLi);
                    });

                    yearLi.appendChild(yearLink);
                    yearLi.appendChild(monthsDropdown);
                    dropdown.appendChild(yearLi);
                }
            } catch (error) {
                console.error('Ошибка при загрузке:', error);
            }
        }


        loadDateDropdown();
    </script>

    <script>
        async function loadContragents() {
            try {
                const response = await fetch('/contragents/all'); // Замените на ваш реальный путь
                if (!response.ok) throw new Error('Ошибка загрузки контрагентов');

                const contragents = await response.json(); // Должен быть массив объектов


                // Пример: Добавляем заголовок "В РАБОТЕ"
                const ul = document.getElementById("contragentList");

// Добавляем заголовок "В РАБОТЕ" со ссылкой
                const titleLi = document.createElement("li");
                titleLi.classList.add("nav-item");

                const titleA = document.createElement("a");
                titleA.classList.add("nav-link");
                titleA.href = "/requests/assigned"; // правильный путь
                const strong = document.createElement("strong");
                strong.textContent = "В РАБОТЕ";
                titleA.appendChild(strong);

                titleLi.appendChild(titleA);
                ul.appendChild(titleLi);

// Добавляем элементы контрагентов
                contragents.forEach(c => {
                    const li = document.createElement("li");
                    li.classList.add("nav-item");

                    const a = document.createElement("a");
                    a.classList.add("nav-link");

                    // Если у тебя есть поле `id`, формируем путь вручную
                    a.href = `/contragents/${c.id}`;
                    a.textContent = c.name;

                    li.appendChild(a);
                    ul.appendChild(li);
                });


            } catch (error) {
                console.error("Ошибка при загрузке контрагентов:", error);
            }
        }

        // Запускаем при загрузке страницы
        loadContragents();
    </script>
