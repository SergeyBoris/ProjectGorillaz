<!DOCTYPE html>
<html lang="en">
<th:block th:replace="fragments/head :: head"></th:block>
<body>

<div class="container mt-4" style="max-width: 900px;">
    <div class="mb-3">
        <label for="contragents" class="form-label">Выберите склад:</label>
        <select id="contragents" class="form-select w-100">
            <option value="">Загрузка...</option>
        </select>
    </div>
    <!-- Поле ввода имени -->
    <div class="mb-3 position-relative">
        <label for="nameSearch" class="form-label">Введите наименование:</label>
        <input type="text" id="nameSearch" class="form-control" placeholder="Начните вводить имя...">

        <!-- Выпадающий список с результатами -->
        <ul id="nameDropdown" class="list-group position-absolute w-100"
            style="max-height: 200px; overflow-y: auto; display: none; z-index: 1000;"></ul>
    </div>
    <!-- Поле ввода модели -->
    <div class="mb-3 position-relative">
        <label for="modelSearch" class="form-label">Введите наименование:</label>
        <input type="text" id="modelSearch" class="form-control" placeholder="Начните вводить модель...">

        <!-- Выпадающий список с результатами -->
        <ul id="modelDropdown" class="list-group position-absolute w-100"
            style="max-height: 200px; overflow-y: auto; display: none; z-index: 1000;"></ul>
    </div>
    <!-- Поле для поиска серийного номера -->
    <div class="mb-3 position-relative">
        <label for="serialSearch" class="form-label">Введите серийный номер:</label>
        <input type="text" id="serialSearch" class="form-control" placeholder="Начните вводить номер...">

        <!-- Выпадающий список с результатами -->
        <ul id="serialDropdown" class="list-group position-absolute w-100"
            style="max-height: 200px; overflow-y: auto; display: none; z-index: 1000;"></ul>
    </div>
</div>



<script>
    let debounceTimer;
    window.onload = async function () {
        const select = document.getElementById('contragents');

        // Загрузка складов (контрагентов)
        try {
            const response = await fetch('/api/contragents/all');
            const contragents = await response.json();

            select.innerHTML = '<option value="">Выберите склад:</option>';
            contragents.forEach(contragent => {
                const option = document.createElement('option');
                option.value = contragent.id;
                option.textContent = contragent.name;
                select.appendChild(option);
            });
        } catch (error) {
            select.innerHTML = '<option value="">Ошибка загрузки</option>';
            console.error('Ошибка при загрузке контрагентов:', error);
        }
    };

    document.addEventListener('DOMContentLoaded', function () {
        const serialSearch = document.getElementById('serialSearch');
        const serialDropdown = document.getElementById('serialDropdown');
        const nameSearch = document.getElementById('nameSearch');
        const nameDropdown = document.getElementById('nameDropdown');
        const modelSearch = document.getElementById('modelSearch');
        const modelDropdown = document.getElementById('modelDropdown');
        nameSearch.addEventListener('input', async function (){
            const query = this.value.trim();

            nameDropdown.innerHTML='';
            nameDropdown.style.display = 'none';
            if(query.length < 1 ){
                return;
            }
             debounceTimer = setTimeout(async () => {
                try {
                    nameDropdown.innerHTML='';
                    nameDropdown.style.display = 'none';
                    const response = await fetch(`/api/equipments/search-names?name=${encodeURIComponent(query)}`)
                    if (!response.ok) throw new Error('Ошибка поиска');
                    const results = await response.json();
                    if (!Array.isArray(results) || results.length === 0) {
                        const li = document.createElement('li');
                        li.className = 'list-group-item text-muted';
                        li.textContent = 'Нет результатов';
                        nameDropdown.appendChild(li);
                    } else {
                        results.forEach(name => {
                            const li = document.createElement('li');
                            li.className = 'list-group-item list-group-item-action';
                            li.textContent = name;
                            li.addEventListener('click', () => {
                                nameSearch.value = name;
                                nameDropdown.style.display = 'none';
                            });
                            nameDropdown.appendChild(li);
                        });
                        nameDropdown.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Ошибка при поиске оборудования:', error);
                    nameDropdown.innerHTML = '';
                    const li = document.createElement('li');
                    li.className = 'list-group-item text-danger';
                    li.textContent = 'Ошибка загрузки данных';
                    nameDropdown.appendChild(li);
                    nameDropdown.style.display = 'block';
                }
            }, 600);
        });
        modelSearch.addEventListener('input', async function (){
            const query = this.value.trim();

            modelDropdown.innerHTML='';
            modelDropdown.style.display = 'none';
            if(query.length < 1 ){
                return;
            }
            debounceTimer = setTimeout(async () => {
                try {

                    const response = await fetch(`/api/equipments/search-model?model=${encodeURIComponent(query)}`)
                    if (!response.ok) throw new Error('Ошибка поиска');
                    const results = await response.json();
                    if (!Array.isArray(results) || results.length === 0) {
                        const li = document.createElement('li');
                        li.className = 'list-group-item text-muted';
                        li.textContent = 'Нет результатов';
                        modelDropdown.appendChild(li);
                    } else {
                        modelDropdown.innerHTML='';
                        modelDropdown.style.display = 'none';
                        results.forEach(name => {
                            const li = document.createElement('li');
                            li.className = 'list-group-item list-group-item-action';
                            li.textContent = name;
                            li.addEventListener('click', () => {
                                modelSearch.value = name;
                                modelDropdown.style.display = 'none';
                            });
                            modelDropdown.appendChild(li);
                        });
                        modelDropdown.style.display = 'block';
                    }
                } catch (error) {
                    console.error('Ошибка при поиске оборудования:', error);
                    modelDropdown.innerHTML = '';
                    const li = document.createElement('li');
                    li.className = 'list-group-item text-danger';
                    li.textContent = 'Ошибка загрузки данных';
                    modelnameDropdown.appendChild(li);
                    modelDropdown.style.display = 'block';
                }
            }, 600);
        });
        serialSearch.addEventListener('input', async function () {
            const query = this.value.trim();
            const contragent = document.getElementById('contragents').value;

            serialDropdown.innerHTML = '';
            serialDropdown.style.display = 'none';

            if (query.length < 2 || !contragent) {
                // Можно показать сообщение, что нужно выбрать склад
                return;
            }
            debounceTimer = setTimeout(async () => {
                try {
                    serialDropdown.innerHTML = '';
                    serialDropdown.style.display = 'none';
                    const response = await fetch(`/api/equipments/search-by-serial?serial=${encodeURIComponent(query)}&contragentId=${encodeURIComponent(contragent)}`);
                    if (!response.ok) throw new Error('Ошибка поиска');

                    const results = await response.json();

                    if (!Array.isArray(results) || results.length === 0) {
                        const li = document.createElement('li');
                        li.className = 'list-group-item text-muted';
                        li.textContent = 'Нет результатов';
                        serialDropdown.appendChild(li);
                    } else {
                        results.forEach(equipment => {
                            const li = document.createElement('li');
                            li.className = 'list-group-item list-group-item-action';
                            li.textContent = `${equipment.serialNumber} ${equipment.model} | ${equipment.name} | ${equipment.equipmentStatus}`;
                            li.addEventListener('click', () => {
                                serialSearch.value = equipment.serialNumber;
                                nameSearch.value = equipment.name;
                                modelSearch.value = equipment.model;
                                serialDropdown.style.display = 'none';

                            });
                            serialDropdown.appendChild(li);
                        });
                    }

                    serialDropdown.style.display = 'block';
                } catch (error) {
                    console.error('Ошибка при поиске оборудования:', error);
                    serialDropdown.innerHTML = '';
                    const li = document.createElement('li');
                    li.className = 'list-group-item text-danger';
                    li.textContent = 'Ошибка загрузки данных';
                    serialDropdown.appendChild(li);
                    serialDropdown.style.display = 'block';
                }
            },600);
        });

        document.addEventListener('click', (e) => {
            if (!serialDropdown.contains(e.target) && e.target !== serialSearch) {
                serialDropdown.style.display = 'none';
            }
            if (!nameDropdown.contains(e.target) && e.target !== nameSearch) {
                nameDropdown.style.display = 'none';
            }
            if (!modelDropdown.contains(e.target) && e.target !== modelSearch) {
                modelDropdown.style.display = 'none';
            }
        });
    });

</script>

</body>
</html>
