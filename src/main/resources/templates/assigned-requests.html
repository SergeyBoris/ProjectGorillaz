<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="fragments/head :: head"></th:block>
<body>
<!-- Вставляем header -->
<th:block th:replace="fragments/header :: header"></th:block>

<main>
    <table id="reqTable" class="table">
        <thead>
        <tr>
            <th>Номер заявки</th>
            <th>Заказчик</th>
            <th>Телефон</th>
            <th>Адрес</th>
            <th>Монтаж</th>
            <th>Демонтаж</th>
            <th>Статус</th>
            <th>Дата создания</th>
            <th>SLA</th>
            <th>Дата закрытия</th>
            <th>Контрагент</th>
            <th>Пользователь</th>
            <th>Комментарий</th>
            <th>Расстояние</th>
            <th></th> <!-- Пустая колонка -->
            <th>Действия</th>
            <th></th> <!-- Для кнопки закрытия -->
        </tr>
        </thead>
        <tbody>
        <tr th:each="req : ${requests}">
            <td th:text="${req.reqNumber}">Номер</td>
            <td th:text="${req.customer}">Заказчик</td>
            <td th:text="${req.customerPhone}">Телефон</td>
            <td th:text="${req.address}" class="wrap-text">Адрес</td>
            <td>
                <div th:each="equipment : ${req.equipmentsMontage}" class="equipment-view-block d-flex align-items-center gap-2">
                    <a class="eq-inline text-decoration-none"
                       th:href="@{/equipment(equipment=${equipment.serialNumber})}" target="_blank">
                        <strong th:text="${equipment.model}">Model</strong> / <span th:text="${equipment.serialNumber}">SN</span>
                    </a>
                    <button type="button" class="btn btn-sm btn-outline-danger remove-equipment-btn">✖</button>
                </div>
                <button type="button" class="btn btn-xs btn-success add-equipment-btn mt-2">➕ Добавить оборудование</button>
            </td>
            <td>
                <div th:each="equipment : ${req.equipmentsUnmontage}" class="equipment-view-block d-flex align-items-center gap-2">
                    <a class="eq-inline text-decoration-none"
                       th:href="@{/equipment(equipment=${equipment.serialNumber})}" target="_blank">
                        <strong th:text="${equipment.model}">Model</strong> / <span th:text="${equipment.serialNumber}">SN</span>
                    </a>
                    <button type="button" class="btn btn-sm btn-outline-danger remove-equipment-btn">✖</button>
                </div>
                <button type="button" class="btn btn-xs btn-success add-equipment-btn mt-2">➕ Добавить оборудование</button>
            </td>
            <td th:text="${req.status}">Статус</td>
            <td th:text="${req.createDate != null ? #temporals.format(req.createDate, 'yyyy-MM-dd HH:mm') : '—'}">Дата создания</td>
            <td th:text="${req.sla != null ? #temporals.format(req.sla, 'yyyy-MM-dd HH:mm') : '—'}">SLA</td>

            <td>
                <input type="datetime-local" class="close-date-input"
                       th:value="${req.closeDate != null ? #temporals.format(req.closeDate, 'yyyy-MM-dd HH:mm') : ''}" />
            </td>
            <td th:text="${req.contragent.name}">Контрагент</td>
            <td th:text="${req.user.name}">Пользователь</td>
            <td th:text="${req.comment}">Комментарий</td>
            <td th:text="${req.rangeToAddress != null ? req.rangeToAddress : ''}">Расстояние</td>
            <td></td>
            <td><button class="btn btn-primary ms-md-2 edit-btn">Изменить</button></td>
            <td>
                <button class="btn btn-sm btn-danger close-btn"
                        th:attr="data-id=${req.id}">
                    Закрыть
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<script th:src="@{/assets/bootstrap/js/bootstrap.min.js}"></script>
<script>

    document.addEventListener('click', function(event) {
        if (event.target.classList.contains('remove-equipment-btn')) {
            const equipmentBlock = event.target.closest('.equipment-view-block');
            if (!equipmentBlock) return;

            // Получаем название модели и серийный номер из блока
            const model = equipmentBlock.querySelector('strong')?.textContent || 'неизвестно';
            const serialNumber = equipmentBlock.querySelector('span')?.textContent || 'неизвестен';

            const confirmMessage = `Вы уверены, что хотите удалить оборудование:\n${model} / ${serialNumber}?`;
            if (confirm(confirmMessage)) {
                equipmentBlock.remove();
            }
        }
    });

</script>

<th:block th:replace="fragments/footer :: footer"></th:block>
</body>
</html>
